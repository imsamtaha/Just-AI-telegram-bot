name: bot-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  risk-guide-and-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Static compilation
        run: python -m compileall -q bot.py risk_reference.py
      - name: Verify Telegram commands with fake sessions
        run: python -m pytest -q
